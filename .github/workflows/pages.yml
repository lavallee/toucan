name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install artoo-artifacts==0.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the artifact
        run: |
          artoo build website
          node scripts/site-figures.mjs

      - name: Firewall and coherence checks
        run: |
          artoo status website
          artoo doctor .
          artoo verify website

      - name: Refuse to publish internal names
        run: node scripts/check-repo.mjs website/site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
