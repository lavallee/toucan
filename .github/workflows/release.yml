name: Release

# Pushing a tag vX.Y.Z builds what people install and publishes it with the release, so that
# releases/latest/download/{install.sh,toucan.tgz} always holds a pair that belong together.
# Packing runs dependencies' install scripts, so it gets no write access; publishing runs no code of the repository's or its dependencies'.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: The tag is the version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Pack
        run: |
          npm pack --silent
          mv toucan-*.tgz toucan.tgz
      - run: node scripts/install-check.mjs toucan.tgz
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            toucan.tgz
            install.sh
            notes.md

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" toucan.tgz install.sh --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
